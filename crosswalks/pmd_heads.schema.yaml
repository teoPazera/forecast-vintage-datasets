table: crosswalks/pmd_heads
description: PMD tax and spending heads -> HOFD series (reviewed by Teo). A row with reviewed = true keeps
  its mapping on reruns.
columns:
- name: measure_type
  type: string
  unit: ''
  description: tax | spending
- name: head_raw
  type: string
  unit: ''
  description: head as the PMD writes it
- name: hofd_sheet
  type: string
  unit: ''
  description: HOFD sheet the head maps to; empty if the HOFD has no such series
- name: series_id
  type: string
  unit: ''
  description: see tables/series (derived from hofd_sheet)
- name: aggregate_series_id
  type: string
  unit: ''
  description: the total the head belongs to (receipts or TME)
- name: confidence
  type: string
  unit: ''
  description: exact | assumed | none (no HOFD series)
- name: note
  type: string
  unit: ''
  description: why an assumed mapping was made
- name: n_measures
  type: integer
  unit: ''
  description: number of distinct measures with this head
- name: reviewed
  type: boolean
  unit: ''
  description: true once Teo has checked the row
- name: comment
  type: string
  unit: ''
  description: reviewer's comment
- name: status
  type: string
  unit: ''
  description: settled_agreement (Jev's top answer = current mapping, confidence >= D20, no negation)
    | pending (provisional mapping, awaiting second model or Teo) | reviewed (decided by Teo) | fixed_in_code;
    empty until routed
- name: labeller
  type: string
  unit: ''
  description: 'who decided the current mapping: keyword rules + Jev (settled by agreement), or the reviewer
    named for reviewed rows'
- name: jev_choice
  type: string
  unit: ''
  description: Jev's top answer (crosswalks/codebook.md)
- name: jev_p1
  type: float
  unit: probability
  description: probability of jev_choice
- name: jev_second
  type: string
  unit: ''
  description: Jev's second answer
- name: jev_p2
  type: float
  unit: probability
  description: probability of jev_second
- name: jev_confidence
  type: float
  unit: ''
  description: Jev's confidence (0-1, from the spread of the probabilities)
- name: route_reason
  type: string
  unit: ''
  description: why the row is pending
